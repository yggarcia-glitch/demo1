server:
  port: 8081
  error:
    include-message: always

spring:
  #SPRING
  application:
    name: demo1
  #FLYWAY
  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-suffixes: .sql
    baseline-on-migrate: true
    schemas: public
  #BD
  datasource:
    url: jdbc:postgresql://localhost:5432/temporal
    username: postgres
    password: "010101"
    driver-class-name: org.postgresql.Driver
  #JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
